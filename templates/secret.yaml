{{/*
Only template a Secret if the user did NOT supply their own. `existingSecret` is
the escape hatch that lets a real deployment manage credentials out-of-band
(SOPS, External Secrets, Vault) while the chart stays unchanged.
*/}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapiredis.secretName" . }}
  labels:
    {{- include "fastapiredis.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret when the release is uninstalled, so a reinstall reuses the
    # same credentials as the (retained) PVC's existing database. Without this,
    # `helm uninstall` + `helm install` gives you a NEW password against an OLD
    # data directory — and Redis keeps its old requirepass on a restored volume,
    # so the app can never authenticate again. (Step 8's warning, in practice.)
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # Read by the app as pydantic-settings' redis_password, and by the Redis
  # container as its --requirepass value. One source, both sides.
  REDIS_PASSWORD: {{ .Values.auth.redisPassword | quote }}
{{- end }}
