apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastapiredis.configMapName" . }}
  labels:
    {{- include "fastapiredis.componentLabels" (dict "ctx" . "component" "app") | nindent 4 }}
data:
  {{/*
    range over a map yields key,value. `$` is the ROOT context — inside range,
    `.` is the current VALUE, so .Values would break here.
    `quote` matters: a ConfigMap's data values must be strings. Without it,
    REDIS_DB: 0 would render as an int and the API server rejects it.
  */}}
  {{- range $key, $value := .Values.app.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Service discovery — templated so the values track the actual Service name.
  # These match the app's pydantic-settings fields (redis_host, redis_port).
  REDIS_HOST: {{ include "fastapiredis.redisServiceName" . | quote }}
  REDIS_PORT: "6379"

  app-info.json: |
    {
      "release": {{ .Release.Name | quote }},
      "namespace": {{ .Release.Namespace | quote }},
      "chart": {{ include "fastapiredis.chart" . | quote }},
      "appVersion": {{ .Chart.AppVersion | quote }},
      "revision": {{ .Release.Revision | quote }},
      "managedBy": "Helm"
    }
