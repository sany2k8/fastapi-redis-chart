# PROD: durable, autoscaled, defensive.
app:
  replicaCount: 3
  image:
    tag: "main"          # pin a real SHA here when promoting deliberately
  service:
    type: NodePort
    # nodePorts are CLUSTER-WIDE — namespaces do not isolate them, so this must
    # not collide with any other service in the cluster.
    nodePort: 30302
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  config:
    APP_ENV: production
    KEY_PREFIX: rdp
    REDIS_DB: "0"
  preStopSleepSeconds: 5
  minReadySeconds: 5

  # Spread replicas across nodes so one node loss doesn't take the app down.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: fastapi-redis
                app.kubernetes.io/component: app

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleDownStabilizationSeconds: 300   # the production default — scale in slow

redis:
  persistence:
    enabled: true
    size: 512Mi

# In a real prod you would NOT put these here — see auth.existingSecret.
auth:
  redisPassword: "r3d1s-s3cr3t"
