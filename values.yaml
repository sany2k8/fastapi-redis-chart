# Default values for the nrmr chart.
# Override with -f myvalues.yaml or --set key=value.
#
# `helm show values ./nrmr` prints this file — so it doubles as your chart's
# public API documentation. Comment it like an API.

# -- Override the generated name (defaults to the chart name)
nameOverride: ""
# -- Override the full generated name (defaults to "<release>-<chart>")
fullnameOverride: ""

# =============================================================================
# App (Express + React)
# =============================================================================
app:
  replicaCount: 3

  image:
    repository: ghcr.io/sany2k8/fastapi-with-redis
    # -- Image tag. Empty = use Chart.appVersion. This is the idiomatic default:
    #    it keeps the shipped app version in one place (Chart.yaml).
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP # ClusterIP | NodePort | LoadBalancer
    port: 80
    # -- Only used when type is NodePort. Cluster-wide unique (see step 6) —
    #    a duplicate is rejected with "provided port is already allocated".
    nodePort: 30301

  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # -- Port the container listens on (uvicorn in the Dockerfile).
  containerPort: 8000

  # -- Probes (step 13). Liveness hits this path, which must touch NO dependency:
  #    if the probe queries the database, a slow database looks like a dead app
  #    and Kubernetes restarts perfectly healthy pods.
  probes:
    # -- Readiness/startup path. GET /health pings Redis and lists the loaded
    #    modules, so it is exactly right for "should this pod take traffic".
    path: /health
    # -- Liveness path. Deliberately NOT /health: that endpoint touches Redis,
    #    so a Redis outage would make Kubernetes kill and restart perfectly
    #    healthy API pods in a loop. /openapi.json is served by FastAPI itself.
    livenessPath: /openapi.json
    startup:
      enabled: true
      failureThreshold: 30
      periodSeconds: 2
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      periodSeconds: 3
      timeoutSeconds: 2
      failureThreshold: 2

  # -- Rolling update strategy (step 12)
  strategy:
    maxUnavailable: 0
    maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  # -- preStop sleep so endpoint removal propagates before SIGTERM (step 13)
  preStopSleepSeconds: 5

  # -- Non-sensitive config -> ConfigMap (step 8)
  config:
    APP_ENV: production
    KEY_PREFIX: rdp
    REDIS_DB: "0"

  # -- Pull secrets for a private registry, e.g. [{name: ghcr-creds}].
  #    Leave empty when the image is public.
  imagePullSecrets: []

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Autoscaling (step 11) — requires metrics-server
# =============================================================================
autoscaling:
  enabled: false # off by default; dev doesn't need it
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 50
  targetMemory: "" # e.g. 150Mi. Empty = no memory metric.
  behavior:
    scaleDownStabilizationSeconds: 300 # 5 min — the production default
    scaleUpStabilizationSeconds: 30

# =============================================================================
# Redis
# =============================================================================
redis:
  enabled: true
  image:
    repository: redis
    # -- Redis 8 bundles JSON, Bloom/CMS/Top-K, Time Series, Search and vector
    #    sets. redis:7-alpine has NONE of them and this app's /health reports
    #    all_types_available:false against it — pinning 8 is not optional.
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 512Mi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

# =============================================================================
# Credentials -> Secret (step 8)
# =============================================================================
# ##########################################################################
# #  PLAINTEXT IN A VALUES FILE IS NOT A SECRET MANAGEMENT STRATEGY.       #
# #                                                                        #
# #  This works for a lab. For real:                                       #
# #    - helm secrets (SOPS)   : encrypt the values file itself            #
# #    - External Secrets Op.  : sync from Vault/AWS SM into a k8s Secret  #
# #    - existingSecret        : create the Secret out-of-band, name it    #
# #                              here, and let the chart just reference it #
# ##########################################################################
auth:
  # -- Reference a Secret you created yourself. When set, the chart does NOT
  #    template a Secret and the values below are ignored. This is the safe path.
  existingSecret: ""
  redisPassword: "r3d1s-s3cr3t"
