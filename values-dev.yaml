# DEV: small, fast, disposable. This is the file ArgoCD renders, and the file
# CI rewrites — see README.
app:
  replicaCount: 1
  image:
    tag: "main"          # CI rewrites this line on every push to main
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  config:
    APP_ENV: dev
    KEY_PREFIX: rdp
    REDIS_DB: "0"
  # no graceful-shutdown wait in dev — restart fast
  preStopSleepSeconds: 0
  minReadySeconds: 0

autoscaling:
  enabled: false         # no HPA in dev

redis:
  persistence:
    enabled: false       # ephemeral — wiped on every restart, deliberately

auth:
  redisPassword: "dev-redis"
